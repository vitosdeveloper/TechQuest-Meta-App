
services:
  # --- BANCOS DE DADOS ---
  postgres:
    image: postgres:15-alpine
    container_name: techquest-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: techquest
      POSTGRES_PASSWORD: techquest_password
      POSTGRES_DB: techquest_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techquest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techquest -d techquest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: techquest-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: techquest
      MONGO_INITDB_ROOT_PASSWORD: techquest_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - techquest-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MENSAGERIA & ASSINCRONISMO ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: techquest-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - techquest-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: techquest-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - techquest-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: techquest-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # AMQP protocol port
      - "127.0.0.1:15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - techquest-network

  redis:
    image: redis:7-alpine
    container_name: techquest-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - techquest-network

  # --- OBSERVABILIDADE ---
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: techquest-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - techquest-network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: techquest-grafana
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - techquest-network

  # --- APLICAÇÕES (TECHQUEST) ---
  api-gateway:
    build:
      context: ./api-gateway
    container_name: techquest-api-gateway
    restart: on-failure
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - USER_SERVICE_URL=http://user-service:3000
      - COURSE_SERVICE_URL=http://course-service:3002
      - GAMIFICATION_SERVICE_URL=http://gamification-service:3003
      - AI_SERVICE_URL=http://ai-service:3004
      - QUERY_SERVICE_URL=http://query-service:3007
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_GRPC_URL=user-service:50051
    depends_on:
      - user-service
      - course-service
      - gamification-service
      - ai-service
      - query-service
      - redis
    networks:
      - techquest-network

  user-service:
    build:
      context: ./user-service
    container_name: techquest-user-service
    restart: on-failure
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://techquest:techquest_password@postgres:5432/techquest_db?schema=users
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - techquest-network

  gamification-service:
    build:
      context: ./gamification-service
    container_name: techquest-gamification-service
    restart: on-failure
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://techquest:techquest_password@postgres:5432/techquest_db?schema=gamification
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - techquest-network

  course-service:
    build:
      context: ./course-service
    container_name: techquest-course-service
    restart: on-failure
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - LESSONS_PATH=/usr/src/app/lessons
    depends_on:
      - redis
    networks:
      - techquest-network

  ai-service:
    build:
      context: ./ai-service
    container_name: techquest-ai-service
    restart: on-failure
    ports:
      - "3004:3004"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      - PORT=3004
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./course-service/lessons:/usr/src/course-service/lessons
    networks:
      - techquest-network

  ollama:
    image: ollama/ollama:latest
    container_name: techquest-ollama
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - techquest-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: techquest-ollama-init
    profiles:
      - ai
    depends_on:
      - ollama
    networks:
      - techquest-network
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Aguardando Ollama iniciar...' &&
      sleep 5 &&
      echo 'Baixando modelo llama3.2 (Isso vai demorar se for a primeira vez)...' &&
      ollama pull llama3.2 &&
      echo 'Baixando modelo nomic-embed-text...' &&
      ollama pull nomic-embed-text &&
      echo 'Modelos prontos!'
      "

  query-service:
    build:
      context: ./query-service
    container_name: techquest-query-service
    restart: on-failure
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      - PORT=3007
      - MONGO_URL=mongodb://techquest:techquest_password@mongodb:27017/techquest_query_db?authSource=admin
      - KAFKA_BROKER=kafka:29092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - techquest-network

  frontend:
    build:
      context: ./frontend
      args:
        # Em prod, requests vão pro NGINX (mesmo host)
        VITE_API_GATEWAY_URL: ""
    container_name: techquest-frontend
    restart: on-failure
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api-gateway
    networks:
      - techquest-network

  mfe-terminal:
    build:
      context: ./mfe-terminal
    container_name: techquest-mfe-terminal
    restart: on-failure
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - techquest-network

  observability-service:
    build:
      context: ./observability-service
    container_name: techquest-observability-service
    restart: on-failure
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      - PORT=3006
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - techquest-network

networks:
  techquest-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  prometheus_data:
  grafana_data:
  ollama_data:
