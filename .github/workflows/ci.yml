name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Gamification Dependencies
      run: cd gamification-service && npm install

    - name: Run Tests (Gamification Service)
      run: cd gamification-service && npm test
